<style>
/* Mise en page : barre latérale marine fixe + espace de travail clair ; documents officiels sur « feuille A4 ». */
:root{
  --navy:#132a52;      /* barre latérale, titres (bleu du logo) */
  --navy-2:#1d3d72;
  --steel:#8d99ad;     /* argent du logo */
  --ground:#eef1f6;    /* fond de travail, gris bleuté */
  --surface:#ffffff;
  --ink:#15213b;
  --muted:#5b6780;
  --line:#d9dfe9;
  --line-2:#e8ecf3;
  --accent:#0d7a63;    /* actions principales (vert des boutons du classeur) */
  --accent-soft:#e3f3ee;
  --amber:#d97b1f;     /* heures sup, avertissements */
  --amber-soft:#fdf1e3;
  --danger:#b3261e;
  --danger-soft:#fbe9e7;
  --f:#d0712c;         /* femmes (graphiques) */
  --h:#2a5ba8;         /* hommes (graphiques) */
  --ff-ui:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --ff-doc:"Spectral","Cambria","Georgia","Times New Roman",serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ff-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--ff-mono);font-size:.92em;letter-spacing:.01em}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:#dfe6f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:20px 16px}
.brand{display:flex;flex-direction:column;gap:10px;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{background:#fff;border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;height:64px}
.brand .logo img{max-height:48px;width:auto}
.brand .logo span{font-weight:800;color:var(--navy);letter-spacing:.06em}
.brand small{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--steel)}
.nav{display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--steel);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#d3dcec;text-decoration:none;font-weight:600;font-size:13.5px}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:#fff;color:var(--navy)}
.nav a.on svg{opacity:1}
.side-foot{padding:12px 20px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--steel);display:flex;flex-direction:column;gap:8px}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ccf9a;margin-right:6px}
.side-foot .dot.ko{background:#f0a23a}
.side-foot button{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:12.5px;text-align:left}
.side-foot button:hover{background:rgba(255,255,255,.14)}

.main{min-width:0;padding-inline:28px;padding-block:22px 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.top h1{font-size:26px;font-weight:800;color:var(--navy)}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#0a6753}
.btn.nav-b{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.amb{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.dan{background:var(--surface);border-color:#e9b6b1;color:var(--danger)}
.btn.dan:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font-size:15px;font-weight:800;color:var(--navy)}
.panel-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fbfcfe;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);background:#fff;outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field input:disabled{background:var(--line-2);color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field.calc output{display:block;padding:8px 10px;border-radius:7px;background:var(--line-2);font-variant-numeric:tabular-nums;font-weight:600;min-height:36px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid}
.note.warn{background:var(--amber-soft);border-color:#f2cf9f;color:#7a4410}
.note.err{background:var(--danger-soft);border-color:#efbcb6;color:#7d1a14}
.note.ok{background:var(--accent-soft);border-color:#b6dfd2;color:#0a5444}
.note.info{background:#edf2fb;border-color:#cdd9ef;color:#22406f}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.actif{background:var(--accent-soft);color:#0a5d4b}
.pill.sortie{background:#eceff4;color:#5b6780}
.pill.cdd{background:#fdf1e3;color:#8a4d12}
.pill.cdi{background:#e7eefb;color:#1d3d72}
.pill.stage{background:#f3e9fb;color:#5b2a86}

/* ---------- Tableaux ---------- */
.tbl-wrap{overflow:auto;max-width:100%}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:#f5f7fb;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl th.num{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#f6f9fd}
.tbl tbody tr.sel td{background:#eaf4f0}
.tbl tbody tr.out td{color:#8a93a6}
.tbl th.c,.tbl td.c{position:sticky;left:0;background:inherit;z-index:2}
.tbl td.c{background:#fff}
.tbl .who b{display:block;font-weight:700}
.tbl .who span{font-size:12px;color:var(--muted)}
.tbl .grpH{background:#eaeef5;color:var(--navy);text-align:center}
.tbl td.k{background:#fafbfd}

/* ---------- KPI / tableau de bord ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:clamp(18px,1.45vw,24px);font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--navy);border-color:var(--navy)}
.kpi.hero .l,.kpi.hero .s{color:#a9b6cc}.kpi.hero .v{color:#fff}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--ff-ui);fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- Tiroir (fiche salarié) & fenêtres ---------- */
.veil{position:fixed;inset:0;background:rgba(14,26,50,.42);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--ground);width:min(860px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(10,20,40,.18)}
.drawer-h{background:var(--surface);padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.drawer-b{overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer-f{background:var(--surface);padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal-veil{position:fixed;inset:0;background:rgba(14,26,50,.48);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(10,20,40,.25)}
.modal h3{font-size:17px;color:var(--navy);padding:18px 22px 0}
.modal .mb{padding:12px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal pre{white-space:pre-wrap;font-family:var(--ff-ui);margin:0;font-size:13.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.2)}

/* ---------- Documents (bulletin, attestation, certificat) ---------- */
.paper-wrap{overflow-x:auto;max-width:100%}
.paper{background:#fff;width:794px;min-height:1050px;margin:0 auto;padding:38px 44px;box-shadow:0 1px 3px rgba(20,30,60,.08),0 12px 30px rgba(20,30,60,.08);color:#111a2e}
.bp{font-size:11.5px}
.bp-head{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.bp-co{display:flex;gap:12px;align-items:center}
.bp-co img{max-height:56px;max-width:110px}
.bp-co b{display:block;font-size:15px;color:var(--navy)}
.bp-co div{line-height:1.5;color:#3d4864}
.bp-title{text-align:right}
.bp-title h2{font-size:22px;letter-spacing:.18em;color:var(--navy);font-weight:800}
.bp-title .per{margin-top:4px;font-weight:600}
.bp-box{border:1px solid #c8d0de;border-radius:6px;margin-top:12px;display:grid}
.bp-box > div{padding:6px 9px;border-right:1px solid #e1e6ef;border-bottom:1px solid #e1e6ef}
.bp-box .k{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:#69748d;font-weight:700}
.bp-box .v{font-weight:700}
.bp-ids{grid-template-columns:repeat(4,1fr)}
.bp-emp{grid-template-columns:repeat(4,1fr)}
.bp table{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}

.bp-sum{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px;border:1px solid #c8d0de;border-radius:6px;overflow:hidden}

.doc{font-family:var(--ff-doc);font-size:15.5px;line-height:1.75}

.doc .sig{margin-top:8px;text-align:right;line-height:1.5}
.doc .sig .cachet{font-size:12px;color:#69748d;font-style:italic;margin-top:70px}

.calcbox{font-size:13px}
.calcbox table{width:100%;border-collapse:collapse}
.calcbox td{padding:6px 8px;border-bottom:1px solid var(--line-2)}
.calcbox td:first-child{color:var(--muted)}
.calcbox tr.hl td{font-weight:800;color:var(--navy);background:#f3f6fb}

.hs-grid input{width:100%;text-align:right;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:#fbfcfe;font-variant-numeric:tabular-nums}
.hs-grid input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--navy-2);box-shadow:0 6px 18px rgba(20,40,80,.08)}

.welcome{background:var(--navy);color:#fff;border-radius:14px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}

.welcome .per small{display:block;color:#a9b6cc;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.welcome .per b{font-size:16px}

/* ========== Version 4 : interface façon Sage i7 ========== */
[hidden]{display:none !important}
/* Fenêtre d'application : barre de titre, menus, barre d'outils, barre de navigation à gauche, espace de travail, barre d'état */
:root{
  --ff-ui:"Segoe UI",Tahoma,Verdana,Arial,sans-serif;
  --navy:#2c3640;--navy-2:#4b5967;--ink:#1f2933;--muted:#5a6673;
  --accent:#3a9b2b;--accent-2:#2f7f22;--accent-soft:#e3f1d8;--sel:#d4ebc3;--sel-bd:#8cc66b;
  --ground:#c8cfd7;--chrome:#eef0f3;--chrome-2:#dde2e8;--bd:#a9b3be;--bd-2:#d3d9df;--title:#2b333c;
  --cap1:#5f6d7b;--cap2:#434f5b;--tint:#f2f4f6;--gold:#8fd16a;--f:#e07b39;--h:#3d7cc9;--steel:#8c98a4;--line:#d3d9df;--line-2:#e6e9ed;--r:2px;
  --amber:#d9822b;--amber-soft:#fcefdf;--danger:#c0312b;--danger-soft:#fbe8e6
}
:root[data-app="bleu"]{--accent:#2f6fc4;--accent-2:#245aa3;--accent-soft:#e1ecfa;--sel:#cfe1f7;--sel-bd:#7fa9df;--gold:#8fb8ef;--h:#2f6fc4}
:root[data-app="gris"]{--accent:#4f5f70;--accent-2:#3e4b59;--accent-soft:#e6eaee;--sel:#d9dfe5;--sel-bd:#97a4b1;--gold:#c9d3dd;--title:#1f252b}
html,body{height:100%;overflow:hidden}
body{font-size:12px;background:var(--ground);color:var(--ink);font-family:var(--ff-ui);-webkit-font-smoothing:auto}
.win{display:flex;flex-direction:column;height:100vh}
.titlebar{height:28px;background:var(--title);color:#e8ecf0;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none;font-size:12px}
.appico{width:18px;height:18px;border-radius:3px;background:var(--accent);color:#fff;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
.titlebar .ctl{margin-left:auto;display:flex;gap:16px;color:#9aa6b2;font-size:11px}
.menubar{height:24px;background:var(--chrome);border-bottom:1px solid var(--bd-2);display:flex;align-items:stretch;padding:0 4px;flex:none;position:relative;z-index:40}
.mi{position:relative}
.mi>button{height:100%;border:0;background:none;padding:0 10px;font-size:12px;cursor:default;color:var(--ink)}
.mi>button:hover,.mi.open>button{background:var(--sel)}
.dd{position:absolute;top:100%;left:0;min-width:240px;background:#fff;border:1px solid var(--bd);box-shadow:2px 3px 10px rgba(0,0,0,.2);padding:3px 0;display:none}
.mi.open .dd{display:block}
.dd a,.dd button{display:flex;align-items:center;gap:9px;width:100%;padding:5px 16px 5px 10px;border:0;background:none;font-size:12px;color:var(--ink);text-decoration:none;text-align:left;cursor:default}
.dd a:hover,.dd button:hover{background:var(--sel)}
.dd svg{width:15px;height:15px;color:var(--accent-2);flex:none}
.dd hr{border:0;border-top:1px solid var(--bd-2);margin:3px 0}
.toolbar{background:linear-gradient(#fbfcfd,#e7ebef);border-bottom:1px solid var(--bd);display:flex;align-items:stretch;gap:1px;padding:3px 6px;flex:none;overflow-x:auto}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:66px;padding:3px 6px;border:1px solid transparent;border-radius:2px;background:none;font-size:11px;color:var(--ink);text-decoration:none;cursor:default;white-space:nowrap}
.tbtn svg{width:22px;height:22px;color:var(--accent-2)}
.tbtn:hover{background:var(--sel);border-color:var(--sel-bd)}
.tbtn.on{background:var(--sel);border-color:var(--sel-bd)}
.tsep{width:1px;background:var(--bd-2);margin:4px 5px;flex:none}
.app{flex:1;min-height:0;display:grid;grid-template-columns:196px minmax(0,1fr)}
.side{position:static;height:auto;min-height:0;background:var(--chrome);color:var(--ink);border-right:1px solid var(--bd);padding:0;display:flex;flex-direction:column}
.navhead{background:linear-gradient(var(--cap1),var(--cap2));color:#fff;font-weight:600;font-size:12px;padding:5px 10px;flex:none}
.nav{padding:0;gap:0;flex:1;overflow-y:auto;display:flex;flex-direction:column}
.nav .grp{background:linear-gradient(#fdfefe,#e2e7ec);border-top:1px solid #fff;border-bottom:1px solid var(--bd-2);color:var(--navy);font-size:11.5px;font-weight:700;text-transform:none;letter-spacing:0;padding:5px 10px}
.nav a{padding:5px 10px 5px 16px;border-radius:0;color:var(--ink);font-weight:400;font-size:12px;gap:8px;box-shadow:none}
.nav a svg{width:16px;height:16px;color:var(--accent-2);opacity:1}
.nav a:hover{background:var(--sel);color:var(--ink)}
.nav a.on{background:var(--accent);color:#fff;box-shadow:none}
.nav a.on svg{color:#fff}
.navlogo{padding:8px;border-top:1px solid var(--bd-2);background:#fff;display:flex;align-items:center;justify-content:center;flex:none;min-height:54px}
.navlogo img{max-height:38px;max-width:150px}
.navlogo span{font-weight:700;color:var(--navy)}
.main{overflow:auto;padding:0 0 10px;background:var(--ground);min-height:0}
.main>.top{position:sticky;top:0;z-index:6;margin:0 0 8px;padding:3px 6px 3px 10px;background:linear-gradient(var(--cap1),var(--cap2));border-bottom:1px solid #3a444e;align-items:center;gap:8px}
.main>*:not(.top){margin-left:8px;margin-right:8px}
.top>div:first-child{display:flex;align-items:baseline;gap:8px}
.top .eyebrow{color:#c3ccd5;font-size:11px;text-transform:none;letter-spacing:0;font-weight:400}
.top .eyebrow::after{content:" ›"}
.top h1{color:#fff;font-size:12.5px;font-weight:600;letter-spacing:0}
.top .actions{gap:4px}
.btn{background:linear-gradient(#ffffff,#e5e9ed);border:1px solid var(--bd);border-radius:2px;padding:3px 10px;font-weight:400;font-size:12px;color:var(--ink);box-shadow:none;gap:5px}
.btn:hover{background:linear-gradient(#f6fbf2,var(--sel));border-color:var(--sel-bd)}
.btn svg{width:14px;height:14px;color:var(--accent-2)}
.btn.pri,.btn.nav-b{background:linear-gradient(var(--accent),var(--accent-2));border-color:var(--accent-2);color:#fff;filter:none}
.btn.pri svg,.btn.nav-b svg{color:#fff}

.btn.amb{background:linear-gradient(#ea9a45,#cf7420);border-color:#b8661b;color:#fff}.btn.amb svg{color:#fff}
.btn.dan{background:linear-gradient(#fff,#f3e6e5);border-color:#d7a29e;color:var(--danger)}.btn.dan svg{color:var(--danger)}
.btn.sm{padding:2px 7px;font-size:11.5px}
.panel,.kpi,.tile{border:1px solid var(--bd);border-radius:2px;box-shadow:none;background:#fff}
.panel-h{background:linear-gradient(#f8f9fa,#e3e7eb);padding:4px 8px;border-bottom:1px solid var(--bd-2)}
.panel-h h2{font-size:12px;font-weight:700;color:var(--navy)}
.panel-b{padding:8px 10px}
.grid{gap:8px}
.field{gap:2px}
.field label{font-size:11.5px;font-weight:400;color:#33404c}
.field input,.field select,.field textarea{border:1px solid #9faab6;border-radius:1px;padding:2px 5px;min-height:22px;background:#fff;font-size:12px}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#fffff4}

.field.calc output{background:#f3f5f7;border:1px solid #d3d9df;border-radius:1px;padding:2px 6px;min-height:22px;font-weight:600}
.note{border-radius:2px;padding:5px 8px;font-size:12px}
table.tbl{font-size:12px;border-collapse:separate}
.tbl th{background:linear-gradient(#fbfcfd,#e1e6eb);border-right:1px solid var(--bd-2);border-bottom:1px solid var(--bd);color:#2c3640;font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px;padding:3px 6px}
.tbl td{border-right:1px solid #e4e8ec;border-bottom:1px solid #e4e8ec;padding:2px 6px;height:23px}
.tbl tbody tr:nth-child(even) td{background:#f5f7f9}
.tbl tbody tr:hover td{background:#eef6e8}
.tbl tbody tr.sel td,.tbl tr.hl td{background:var(--sel) !important}
.tbl tfoot td{background:linear-gradient(#f1f3f5,#e3e7eb);border-top:1px solid var(--bd)}
.tbl tfoot .stk{background:#e9ecef}
.tbl .grpH{background:linear-gradient(#eef1f4,#dde2e7);color:var(--navy)}
.tbl .grp-in{background:linear-gradient(#f4faef,#e2f0d7);color:var(--accent-2)}
.tbl .grp-calc{background:linear-gradient(#f2f5f8,#e1e7ee);color:var(--navy)}
.tbl td.ed{background:#fffef6}
.tbl tbody tr:nth-child(even) td.ed{background:#fbfaee}
.tbl .who b{font-weight:600}
.cellin{border-radius:1px;padding:1px 4px}
.cellin:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#fffff4}
.pill{border-radius:2px;padding:0 6px;font-size:11px;font-weight:600}
.pill.actif{background:var(--accent-soft);color:var(--accent-2)}
.seg{gap:0}

.kpis{gap:6px}
.kpi{padding:5px 9px;gap:0}

<body>


<div class="win">
  <div class="titlebar"><span class="appico">RH</span><span id="tbTitle">Gestion RH &amp; Paie</span><span class="ctl"><span>Version 2.1</span></span></div>
  <div class="menubar" id="menubar"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="app">
    <aside class="side">
      <div class="navhead">Barre de navigation</div>
      <nav class="nav" id="nav"></nav>
      <div class="navlogo" id="brandLogo"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="statusbar" id="statusbar"><span id="driveState"></span><span id="autoState"></span><span id="saveState"></span></div>
  <input type="file" id="fileRestore" accept=".json,application/json" hidden>
</div>
<div id="print-zone"></div>

<script>
/* ==========================================================================
   MOTEUR DE CALCUL RH — reprise fidèle des formules du classeur
   « Logiciel de gestion RH copie.xlsm » (Tableau1, Bulletin de Paie,
   Calcul des Heures Supp, Données / Tableau de Bord, macros VBA)
   et de « CALCUL ITS 2016.xlsx ».
   Chaque fonction cite la cellule Excel qu'elle reproduit.
   ========================================================================== */
var RH = (function () {
  'use strict';

  // ---------- Outils « à la manière d'Excel » ----------
  function blank(v) { return v === null || v === undefined || v === ''; }
  // Conversion numérique comme les opérateurs + - * d'Excel ("000" -> 0, vide -> 0)
  function N(v) {
    if (blank(v) || v === false) return 0;
    if (v === true) return 1;
    if (typeof v === 'number') return v;
    var n = Number(String(v).replace(/\s/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  // ROUND d'Excel : arrondi « au plus loin de zéro »
  function ROUND(x, d) {
    var m = Math.pow(10, d || 0);
    var y = Math.abs(x) * m;
    var r = Math.floor(y + 0.5 + 1e-9);
    return Math.sign(x) * r / m;
  }
  // ROUNDDOWN d'Excel (vers zéro). d peut être négatif (-3 = au millier)
  function ROUNDDOWN(x, d) {
    var m = Math.pow(10, d || 0);
    var y = Math.abs(x) * m;
    return Math.sign(x) * Math.floor(y + 1e-9) / m;
  }
  function FLOOR(x, s) { return Math.floor(x / s + 1e-12) * s; }
  function CEILING(x, s) { return Math.ceil(x / s - 1e-12) * s; }

  // ---------- Dates (chaînes AAAA-MM-JJ, sans fuseau horaire) ----------
  function parseD(s) {
    if (blank(s)) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) return null;
    return { y: +m[1], m: +m[2], d: +m[3] };
  }
  function serial(s) { // numéro de série façon Excel, pour comparer
    var p = parseD(s); if (!p) return null;
    return Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(1899, 11, 30)) / 86400000);
  }
  function todayISO() {
    var t = new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  // DATEDIF(debut, fin, "Y")
  function DATEDIF_Y(a, b) {
    var p = parseD(a) || { y: 1899, m: 12, d: 30 }, q = parseD(b);
    var y = q.y - p.y;
    if (q.m < p.m || (q.m === p.m && q.d < p.d)) y--;
    return y;
  }
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  // Q15/Q16/Q17/Q18 de l'attestation : « 1er janvier 2000 »
  function dateLettres(s) {
    var p = parseD(s); if (!p) return '';
    return p.d + (p.d === 1 ? 'er' : '') + ' ' + MOIS[p.m - 1] + ' ' + p.y;
  }

  // ---------- Paramètres par défaut (feuille Paramètres) ----------
  var PARAM_DEFAUT = {
    nom: 'ABA GROUP', adresse: 'Hamdallaye', tel: '72210216', email: 'abagroupmali@gmail.com',
    mention: 'CCCF', ville: 'Bamako', fonctionSign: 'Directeur Général', nomSign: 'Hassa Abraham COULIBALY',
    logo: '',
    tauxInpsSal: 0.036,   // C23
    tauxInpsEmp: 0.18,    // C24
    ca: 350000000,        // C25
    hs1: 0.1, hs2: 0.25, hs3: 0.5, hs4: 1, // C26:C29
    ages: [[0, 24, '<25'], [25, 34, '25-34'], [35, 44, '35-44'], [45, 54, '45-54'], [55, null, '55+']],
    salaires: [[0, 249000, '<250000'], [250000, 499000, '250000 - 499000'], [500000, 749000, '500000 - 749000'],
      [750000, 999000, '750000 - 999000'], [1000000, 1499000, '1000000 - 1499000'], [1500000, null, '1500000 +']]
  };
  var SEUIL_CA = 250000000; // Personnels!AW4

  // VLOOKUP(valeur, table, 3, TRUE)
  function vlookupApprox(v, table) {
    var res = null;
    for (var i = 0; i < table.length; i++) { if (N(table[i][0]) <= v) res = table[i][2]; else break; }
    return res === null ? '#N/A' : res;
  }

  // ======================================================================
  //  LIGNE DU TABLEAU PERSONNELS (Tableau1, colonnes S à BH)
  // ======================================================================
  function calcLigne(e, P, today) {
    today = today || todayISO();
    var stage = e.contrat === 'STAGE';
    var r = {};
    // S  Ancienneté (ans)
    r.anc = blank(e.entree) ? '' : DATEDIF_Y(e.entree, today);
    // T  Taux ancienneté
    var a = r.anc;
    if (a === '') r.tauxAnc = false;
    else if (a <= 4) r.tauxAnc = 0; else if (a === 5) r.tauxAnc = 0.03; else if (a === 6) r.tauxAnc = 0.05;
    else if (a === 7) r.tauxAnc = 0.06; else if (a === 8) r.tauxAnc = 0.07; else if (a === 9) r.tauxAnc = 0.08;
    else if (a === 10) r.tauxAnc = 0.09; else if (a === 11) r.tauxAnc = 0.1; else if (a === 12) r.tauxAnc = 0.11;
    else if (a === 13) r.tauxAnc = 0.12; else if (a === 14) r.tauxAnc = 0.13; else if (a === 15) r.tauxAnc = 0.14;
    else if (a <= 65) r.tauxAnc = 0.15; else r.tauxAnc = false;
    var U = e.base;
    // V  Indemnité spéciale 1973
    r.isp73 = stage ? '000' : (blank(U) ? '' : (N(U) > 1 ? 1000 : false));
    // W  Cherté de vie 1974
    r.icv74 = stage ? '000' : N(U) * 0.10;
    // X  Solidarité 1991
    r.isol91 = stage ? '000' : (e.cat === 'A' ? 2000 : e.cat === 'B' ? 5000 : e.cat === 'C' ? 6000 : false);
    // Y  Prime d'ancienneté
    r.panc = N(U) * N(r.tauxAnc);
    // AJ Salaire brut
    r.brut = N(U) + N(r.isp73) + N(r.icv74) + N(r.isol91) + N(r.panc) + N(e.transport) + N(e.caisse) + N(e.monture) +
      N(e.resp) + N(e.avn) + N(e.hs10) + N(e.hs25) + N(e.hs50) + N(e.hs100) + N(e.sursal);
    // AK Base cotisable
    r.baseCot = stage ? '' : r.brut - (N(e.transport) + N(e.caisse) + N(e.monture));
    // AL INPS, AM AMO, AO INPS2, AP AMO2
    r.inps = stage ? '' : N(r.baseCot) * P.tauxInpsSal;
    r.amo = stage ? '' : N(r.baseCot) * 0.0306;
    r.inps2 = stage ? '' : N(r.baseCot) * P.tauxInpsEmp;
    r.amo2 = stage ? '' : N(r.baseCot) * 0.035;
    // AZ Base CF TL
    r.baseCFTL = stage ? '000' : FLOOR(r.brut, 250);
    // AQ CF, AR TL
    r.cf = stage ? '' : N(r.baseCFTL) * 0.035;
    r.tl = stage ? '' : N(r.baseCFTL) * 0.01;
    // AS Salaire de base 10 %
    r.b10 = stage ? '' : N(U) * 0.10;
    // AT / AU / AV : parts exonérées transport, caisse, monture (plafond 10 % du base)
    function plafond(x, gardeStage) {
      if (gardeStage && stage) return '';
      if (blank(x)) return '000';
      if (r.b10 === '') return x;           // nombre < texte dans Excel
      return N(x) < r.b10 ? x : r.b10;
    }
    r.itsT = plafond(e.transport, true);
    r.itsC = plafond(e.caisse, false);
    r.itsM = plafond(e.monture, false);
    // AW Responsabilité exonérée
    r.respS = blank(e.resp) ? '000' : (N(P.ca) < SEUIL_CA ? 60000 : 80000);
    // AX Avantage en nature exonéré (50 %)
    r.avnS = blank(e.avn) ? '000' : N(e.avn) / 2;

    r.baseImp = stage ? '' : r.brut - (N(r.inps) + N(r.isol91) + N(r.itsT) + N(r.itsC) + N(r.itsM) + N(r.respS) + N(r.avnS));
    // BA Âge
    r.age = DATEDIF_Y(e.naissance, today);
    // BD Statut
    r.statut = (blank(e.sortie) || serial(e.sortie) > serial(today)) ? 'Actif' : 'Sortie';
    // BH Masse salariale
    r.masse = stage ? '' : r.brut + N(r.inps2) + N(r.amo2) + N(r.cf) + N(r.tl);
    // BE Tranche S
    r.trancheS = stage ? r.brut : CEILING(N(r.masse), 25000);
    // BF Tranche salaire, BG Tranche âge
    r.trancheSal = r.statut === 'Actif' ? vlookupApprox(N(r.trancheS), P.salaires) : '<250000';
    r.trancheAge = r.statut === 'Actif' ? vlookupApprox(r.age, P.ages) : '';
    appliquerRubriques(e, r, P, stage);

  }

  // ======================================================================
  //  RUBRIQUES PARAMÉTRÉES PAR L'UTILISATEUR (ajout, sans toucher aux
  //  formules d'origine : sans rubrique, les résultats sont identiques)
  // ======================================================================
  function valeurRubrique(rb, e) {
    if (rb.mode === 'fixe') return N(rb.valeur);
    if (rb.mode === 'taux') return N(e.base) * N(rb.valeur) / 100;
    return N(e.rub && e.rub[rb.code]);
  }
  function appliquerRubriques(e, r, P, stage) {
    r.rubGains = []; r.rubRet = [];
    var rubs = (P.rubriques || []).filter(function (x) { return x.actif !== false; });
    if (!rubs.length) return;
    var G = 0, Gc = 0, Gi = 0;
    rubs.forEach(function (rb) {
      var v = valeurRubrique(rb, e);
      if (!v) return;
      var l = { code: rb.code, lib: rb.lib, v: v, taux: rb.mode === 'taux' ? N(rb.valeur) / 100 : '', base: rb.mode === 'taux' ? N(e.base) : v };
      if (rb.type === 'retenue') { r.rubRet.push(l); return; }
      r.rubGains.push(l); G += v; if (rb.cot) Gc += v; if (rb.its) Gi += v;
    });
    if (!G) return;
    r.brut += G;
    if (stage) { r.trancheS = r.brut; }
    else {
      r.baseCot = N(r.baseCot) + Gc;
      r.inps = r.baseCot * P.tauxInpsSal; r.amo = r.baseCot * 0.0306;
      r.inps2 = r.baseCot * P.tauxInpsEmp; r.amo2 = r.baseCot * 0.035;
      r.baseCFTL = FLOOR(r.brut, 250); r.cf = r.baseCFTL * 0.035; r.tl = r.baseCFTL * 0.01;
      r.baseImp = r.brut - (N(r.inps) + N(r.isol91) + N(r.itsT) + N(r.itsC) + N(r.itsM) + N(r.respS) + N(r.avnS)) - (G - Gi);
      r.masse = r.brut + r.inps2 + r.amo2 + r.cf + r.tl;
      r.trancheS = CEILING(r.masse, 25000);
    }
    r.trancheSal = r.statut === 'Actif' ? vlookupApprox(N(r.trancheS), P.salaires) : '<250000';
  }

  // ======================================================================
  //  BULLETIN DE PAIE (feuille Bulletin de Paie, C3:J58 + calcul ITS P42:Q65)
  // ======================================================================
  var DIV0 = '#DIV/0!';
  function tranchesITS(q) { // Q45:Q56 (seuils exactement comme dans le classeur)
    return [
      q > 0 ? (q > 330000 ? 0 : (q - 0) * 0) : 0,
      q > 330001 ? (q > 578400 ? 12420 : (q - 330001) * 0.05) : 0,
      q > 578401 ? (q > 1176400 ? 71760 : (q - 578401) * 0.12) : 0,
      q > 1176401 ? (q > 1789733 ? 110400 : (q - 1176401) * 0.18) : 0,
      q > 1789734 ? (q > 2384195 ? 154560 : (q - 1789734) * 0.26) : 0,
      q > 2384196 ? (q > 3494130 ? 344080 : (q - 2384196) * 0.31) : 0,
      q > 3494130 ? (q - 3494130) * 0.37 : 0
    ];
  }
  function calcITS(baseImp, situation, enfants) {
    var o = {};
    o.q42 = blank(baseImp) ? 0 : FLOOR(N(baseImp), 250);           // D42 / Q42
    o.q44 = ROUNDDOWN(o.q42 * 12, -3);                              // Q44
    o.tranches = tranchesITS(o.q44);
    o.q57 = o.tranches.reduce(function (s, x) { return s + x; }, 0); // ITS annuel brut
    var nb = N(enfants);
    o.q60 = (String(situation || '').slice(0, 5) === 'Marié' ? 0.10 : 0) + (nb > 0 ? (nb <= 10 ? 0.025 * nb : 0.25) : 0);
    o.q61 = o.q57 - (o.q57 * o.q60);                                 // ITS annuel net
    if (o.q44 === 0) { o.q62 = DIV0; o.q63 = DIV0; o.q64 = DIV0; o.q65 = DIV0; return o; }
    o.q62 = o.q61 / o.q44;                                           // % ITS net
    o.q63 = o.q62 - 0.02;                                            // moins 2 points
    if (o.q62 === 0) { o.q64 = DIV0; o.q65 = DIV0; return o; }
    o.q64 = ROUNDDOWN((o.q63 / o.q62) * o.q61, 0);                   // nouvel ITS annuel net
    o.q65 = o.q64 / 12;                                              // ITS mensuel
    return o;
  }
  function err(v) { return v === DIV0; }

    var s = 0;
    for (var i = 0; i < arguments.length; i++) { if (err(arguments[i])) return DIV0; s += N(arguments[i]); }
    return s;
  }

  function bulletin(e, r, P, ret) {
    ret = ret || {};
    var stagiaire = e.poste === 'Stagiaire';  // test G7="Stagiaire" du bulletin
    var b = { e: e, r: r };
    b.lignes = [
      { lib: 'Salaire de Base', nb: 1, base: e.base, taux: '', gain: N(e.base) },
      { lib: 'Indemnité spéciale 1973', nb: 1, base: r.isp73, taux: '', gain: N(r.isp73) },
      { lib: 'Indemnité de cherté de vie 1974', nb: '', base: e.base, taux: 0.1, gain: N(r.icv74) },
      { lib: 'Indemnité de solidarité 1991', nb: 1, base: r.isol91, taux: '', gain: N(r.isol91) },
      { lib: "Prime d'ancienneté", nb: '', base: e.base, taux: N(r.tauxAnc), gain: N(e.base) * N(r.tauxAnc) },
      { lib: 'Indemnité de Transport', nb: 1, base: e.transport, taux: '', gain: N(e.transport) },
      { lib: 'Indemnité de Caisse', nb: 1, base: e.caisse, taux: '', gain: N(e.caisse) },
      { lib: 'Indemnité de Monture', nb: 1, base: e.monture, taux: '', gain: N(e.monture) },
      { lib: 'Indemnité de Responsabilité', nb: 1, base: e.resp, taux: '', gain: N(e.resp) },
      { lib: 'Avantage en nature', nb: 1, base: e.avn, taux: '', gain: N(e.avn) },
      { lib: 'Heures supplémentaires ' + pct0(P.hs1), nb: 1, base: e.hs10, taux: '', gain: N(e.hs10) },
      { lib: 'Heures supplémentaires ' + pct0(P.hs2), nb: 1, base: e.hs25, taux: '', gain: N(e.hs25) },
      { lib: 'Heures supplémentaires ' + pct0(P.hs3), nb: 1, base: e.hs50, taux: '', gain: N(e.hs50) },
      { lib: 'Heures supplémentaires ' + pct0(P.hs4), nb: 1, base: e.hs100, taux: '', gain: N(e.hs100) },
      { lib: 'Sursalaire', nb: 1, base: e.sursal, taux: '', gain: N(e.sursal) }
    ];
    (r.rubGains || []).forEach(function (g) { b.lignes.push({ lib: g.lib, nb: 1, base: g.base, taux: g.taux, gain: g.v, rub: true }); });
    b.rubRet = r.rubRet || [];
    b.totRubRet = b.rubRet.reduce(function (s, x) { return s + x.v; }, 0);
    b.brut = r.brut;                                         // G38
    b.inps = { base: r.baseCot, ts: P.tauxInpsSal, rs: stagiaire ? 0 : N(r.inps), tp: P.tauxInpsEmp, rp: stagiaire ? 0 : N(r.inps2) };
    b.amo = { base: r.baseCot, ts: 0.0306, rs: stagiaire ? 0 : N(r.amo), tp: 0.035, rp: stagiaire ? 0 : N(r.amo2) };
    b.its = calcITS(r.baseImp, e.situation, e.enfants);
    b.its.base = r.baseImp;                                  // E42
    b.its.rs = stagiaire ? 0 : b.its.q65;                    // H42
    b.cf = { base: r.baseCFTL, tp: 0.035, rp: stagiaire ? 0 : N(r.cf) };
    b.tl = { base: r.baseCFTL, tp: 0.01, rp: stagiaire ? 0 : N(r.tl) };
    b.totSal = addX(b.inps.rs, b.amo.rs, b.its.rs);          // H46
    b.totPat = b.inps.rp + b.amo.rp + b.cf.rp + b.tl.rp;     // J46
    b.retenue = N(ret.retenue);                              // H48
    b.pret = N(ret.pret);                                    // H49

    b.net = err(deduc) ? DIV0 : ROUND(b.brut - deduc, 0);    // J55

  function pct0(x) { return Math.round(x * 100) + '%'; }

  // ======================================================================
  //  CALCUL DES HEURES SUPP
  // ======================================================================
  function heuresSup(e, grille, P) {
    var o = {};
    o.respHS = N(e.resp);                                    // nom défini RespHS
    o.base = N(e.base);                                      // D4
    o.tauxH = o.base / 173.33;                               // D5
    o.taux = [1 + P.hs1, 1 + P.hs2, 1 + P.hs3, 1 + P.hs4];   // D18:G18
    o.heures = [0, 1, 2, 3].map(function (k) {               // D13:G13
      var s = 0; for (var w = 0; w < 5; w++) s += N(grille[w] && grille[w][k]); return s;
    });
    o.montants = o.heures.map(function (h, k) { return o.respHS > 0 ? 0 : o.tauxH * o.taux[k] * h; }); // D20:G20
    return o;
  }

  // ======================================================================
  //  CALCUL À L'ENVERS (module CalculEnvers) : sursalaire pour un net donné
  // ======================================================================
  function netSans(e, P, ret, today, s) {
    var c = Object.assign({}, e, { hs10: '', hs25: '', hs50: '', hs100: '', sursal: s === 0 ? '' : s });
    var b = bulletin(c, calcLigne(c, P, today), P, ret);
    if (b.erreur) return { net: -1, brut: b.brut };
    return { net: N(b.net) + b.retenue + b.pret + b.totRubRet, brut: b.brut };
  }
  function chercherSursalaire(e, P, ret, today, cible) {
    var n0 = netSans(e, P, ret, today, 0);
    if (n0.net >= cible) return { ok: false, net: n0.net };
    var bas = 0, hi = cible, essais = 0;
    while (netSans(e, P, ret, today, hi).net < cible && essais < 20) { bas = hi; hi = hi * 2; essais++; }
    while (hi - bas > 1) {
      var mi = Math.floor((bas + hi) / 2);
      if (netSans(e, P, ret, today, mi).net >= cible) hi = mi; else bas = mi;
    }
    var f = netSans(e, P, ret, today, hi);
    return { ok: true, sursalaire: hi, net: f.net, brut: f.brut };
  }

  // ======================================================================
  //  MATRICULE SUIVANT (Validation!S2)
  // ======================================================================
  function prochainMatricule(liste) {
    var t = liste.filter(function (m) { return !blank(m); });
    var f = t[0] || '';
    var p = f === '' ? 'AB' : String(f).slice(0, String(f).length - 3);
    var mx = 0;
    t.forEach(function (m) { var n = Number(String(m).slice(-3)); if (!isNaN(n) && n > mx) mx = n; });
    return p + String(mx + 1).padStart(3, '0');
  }

  // ======================================================================
  //  RECHERCHE (module Recherche, FiltrerPersonnels)
  // ======================================================================
  function sansAccent(s) {
    var a = 'àâäçèéêëîïôöùûü', b = 'aaaceeeeiioouuu';
    return s.replace(/[àâäçèéêëîïôöùûü]/g, function (c) { return b[a.indexOf(c)]; });
  }
  function correspond(e, crit) {
    crit = sansAccent(String(crit || '').toLowerCase().trim().replace(/\s+/g, ' '));
    if (crit === '') return true;
    if (blank(e.mat)) return false;
    var genre = sansAccent(String(e.genre || '').toLowerCase().trim());
    var texte = '|' + sansAccent((String(e.prenom || '') + '|' + String(e.nom || '') + '|' + String(e.dept || '') + '|' + String(e.contrat || '')).toLowerCase()) + '|';
    return crit.split(' ').every(function (mot) {
      if (mot === 'homme' || mot === 'hommes') mot = 'h';
      if (mot === 'femme' || mot === 'femmes') mot = 'f';
      if (mot.length === 1) return genre === mot;
      return texte.indexOf(mot) >= 0;

  // ======================================================================
  //  TABLEAU DE BORD (feuille Données : tableaux croisés + turnover)
  // ======================================================================
  function tableauDeBord(rows, P, today, filtres) {
    filtres = filtres || {};
    var y = Number(today.slice(0, 4));                       // Période = YEAR(TODAY())
    var actifs = rows.filter(function (x) { return x.r.statut === 'Actif' && !blank(x.e.mat); });
    function moy(arr) { var v = arr.filter(function (x) { return typeof x === 'number'; }); return v.length ? v.reduce(function (s, x) { return s + x; }, 0) / v.length : 0; }
    function somme(arr) { return arr.reduce(function (s, x) { return s + (typeof x === 'number' ? x : 0); }, 0); }
    var o = {};
    // TCD1 (segment « Nature du contrat ») : effectif, somme brut, âge moyen
    var t1 = actifs.filter(function (x) { return !filtres.contrat || x.e.contrat === filtres.contrat; });
    o.effectif = t1.length;
    o.sommeBrut = somme(t1.map(function (x) { return x.r.brut; }));
    o.ageMoyen = moy(t1.map(function (x) { return x.r.age; }));
    // TCD2 : moyennes
    o.moyBrut = moy(actifs.map(function (x) { return x.r.brut; }));
    o.salaireMoyen = moy(actifs.map(function (x) { return x.r.masse; }));
    o.ancMoyenne = moy(actifs.map(function (x) { return x.r.anc; }));
    // TCD14 : somme masse salariale
    o.masse = somme(actifs.map(function (x) { return x.r.masse; }));
    // TCD8 : effectif par genre
    o.genre = { F: actifs.filter(function (x) { return x.e.genre === 'F'; }).length, H: actifs.filter(function (x) { return x.e.genre === 'H'; }).length };
    // TCD3 : départements x genre
    var deps = uniq(actifs.map(function (x) { return x.e.dept; })).sort(cmpTxt);
    o.depGenre = deps.map(function (d) {
      return { dept: d, F: actifs.filter(function (x) { return x.e.dept === d && x.e.genre === 'F'; }).length, H: actifs.filter(function (x) { return x.e.dept === d && x.e.genre === 'H'; }).length };
    });
    // TCD5 : répartition par contrat
    o.contrats = uniq(actifs.map(function (x) { return x.e.contrat; })).sort(cmpTxt).map(function (c) {
      return { contrat: c, n: actifs.filter(function (x) { return x.e.contrat === c; }).length };
    });
    // TCD6 : masse salariale par département (tri croissant)
    o.masseDep = deps.map(function (d) {
      return { dept: d, v: somme(actifs.filter(function (x) { return x.e.dept === d; }).map(function (x) { return x.r.masse; })) };
    }).sort(function (a, b) { return a.v - b.v; });
    // TCD7 et TCD10 (segment « Département ») : pyramide des âges, tranches de salaire
    var t7 = actifs.filter(function (x) { return !filtres.dept || x.e.dept === filtres.dept; });
    o.pyramide = P.ages.map(function (a) { return a[2]; }).map(function (lab) {
      return { lab: lab, F: t7.filter(function (x) { return x.r.trancheAge === lab && x.e.genre === 'F'; }).length, H: t7.filter(function (x) { return x.r.trancheAge === lab && x.e.genre === 'H'; }).length };
    }).filter(function (l) { return l.F + l.H > 0; });
    o.tranchesSal = P.salaires.map(function (a) { return a[2]; }).map(function (lab) {
      return { lab: lab, F: t7.filter(function (x) { return x.r.trancheSal === lab && x.e.genre === 'F'; }).length, H: t7.filter(function (x) { return x.r.trancheSal === lab && x.e.genre === 'H'; }).length };
    }).filter(function (l) { return l.F + l.H > 0; });
    // Turnover (Données!B9:B16), hors STAGE
    var d1 = serial(y + '-01-01'), d31 = serial(y + '-12-31');
    var ns = rows.filter(function (x) { return x.e.contrat !== 'STAGE'; });
    function sv(s) { return serial(s); }
    o.departs = ns.filter(function (x) { var s = sv(x.e.sortie); return s !== null && s >= d1 && s <= d31; }).length;
    var b10 = ns.filter(function (x) { var en = sv(x.e.entree), s = sv(x.e.sortie); return en !== null && en <= d1 && s !== null && s >= d1; }).length;
    var b11 = ns.filter(function (x) { var en = sv(x.e.entree); return en !== null && en <= d1 && blank(x.e.sortie); }).length;
    var b13 = ns.filter(function (x) { var en = sv(x.e.entree), s = sv(x.e.sortie); return en !== null && en <= d31 && s !== null && s > d31; }).length;
    var b14 = ns.filter(function (x) { var en = sv(x.e.entree); return en !== null && en <= d31 && blank(x.e.sortie); }).length;
    o.eff01 = b10 + b11; o.eff31 = b13 + b14;

    // Prochains contrats à échéance (Tableau de Bord!Y10)
    var t = serial(today);
    o.echeances = actifs.filter(function (x) { return !blank(x.e.fin) && serial(x.e.fin) >= t; })
      .sort(function (a, b) { return serial(a.e.fin) - serial(b.e.fin); }).slice(0, 5);
    return o;
  }
  function uniq(a) { return a.filter(function (x, i) { return !blank(x) && a.indexOf(x) === i; }); }
  function cmpTxt(a, b) { return String(a).localeCompare(String(b), 'fr'); }

  // Bulletin à éditer pour la période (Departs.PresentSurPeriode)
  function presentSurPeriode(e, debut, fin) {
    if (!blank(e.sortie) && serial(e.sortie) < serial(debut)) return false;
    if (!blank(e.entree) && serial(e.entree) > serial(fin)) return false;
    return true;
  }

  // ======================================================================
  //  CALCUL ITS 2016 (classeur « CALCUL ITS 2016.xlsx »)
  // ======================================================================
  function its2016(brutMensuel, marie, enfants) {
    var F = [330000, 578400, 1176400, 1789733, 2384195, 3494130], G = [0, 0.05, 0.12, 0.18, 0.26, 0.31, 0.37];
    var H = [0, (F[1] - F[0]) * G[1], (F[2] - F[1]) * G[2], (F[3] - F[2]) * G[3], (F[4] - F[3]) * G[4], (F[5] - F[4]) * G[5]];

    for (var j = 0; j < 7; j++) o.bareme.push({ de: bornesInf[j], a: j < 6 ? F[j] : null, taux: G[j], its: j < 6 ? H[j] : null, cumul: j < 6 ? I[j] : null });
    o.c10 = FLOOR(N(brutMensuel), 250);
    o.c11 = o.c10 * 12;
    var c = o.c11;
    o.c12 = c <= F[0] ? 0 : c <= F[1] ? (c - F[0]) * G[1] : c <= F[2] ? (c - F[1]) * G[2] + I[1] : c <= F[3] ? (c - F[2]) * G[3] + I[2] :
      c <= F[4] ? (c - F[3]) * G[4] + I[3] : c <= F[5] ? (c - F[4]) * G[5] + I[4] : (c - F[5]) * G[6] + I[5];
    o.c13 = marie ? 0.1 : 0;
    o.c14 = N(enfants) <= 10 ? N(enfants) * 0.025 : 0.25;
    o.c15 = o.c13 + o.c14;
    o.c16 = o.c12 - o.c12 * o.c15;
    o.c17 = o.c11 ? o.c16 / o.c11 : DIV0;
    o.c18 = err(o.c17) ? DIV0 : o.c17 - 0.02;
    o.c19 = err(o.c18) ? DIV0 : o.c11 * o.c18;
    o.c20 = err(o.c19) ? DIV0 : o.c19 / 12;

  }

  return {
    N: N, blank: blank, ROUND: ROUND, ROUNDDOWN: ROUNDDOWN, FLOOR: FLOOR, serial: serial, parseD: parseD,
    todayISO: todayISO, dateLettres: dateLettres, DATEDIF_Y: DATEDIF_Y, PARAM_DEFAUT: PARAM_DEFAUT, DIV0: DIV0,
    calcLigne: calcLigne, bulletin: bulletin, calcITS: calcITS, heuresSup: heuresSup, chercherSursalaire: chercherSursalaire,
    prochainMatricule: prochainMatricule, correspond: correspond, tableauDeBord: tableauDeBord,

})();

function vide() { return '<div style="color:var(--muted);padding:20px 0">Aucune donnée.</div>'; }

function chMasse(data) {

// ---------- Espace : entreprises, licences ----------
function licenceValide(o) {
  if (!CL.horsLigne) return !!o.licence_ok;
  var t = today(); return o.actif && t >= o.licence_debut && t <= o.licence_fin;
}
function estEditeur() { return !!(CL.espace && CL.espace.editeur); }
function estAdmin() { return estEditeur() || !!(CL.org && CL.org.role === 'admin'); }
function lectureSeule() { return !!(CL.org && CL.org.role === 'lecture'); }
var ROLES = { admin: 'Administrateur', gestionnaire: 'Gestionnaire de paie', lecture: 'Consultation seule' };

function chargerEspace() {
  ecranChargement('Connexion…');
  rpc('mon_espace').then(function (esp) {
    CL.espace = esp; CL.horsLigne = false;
    if (CL.sess && !CL.sess.user) { CL.sess.user = { id: esp.user_id, email: esp.email }; lsSet('rh_session', CL.sess); }
    lsSet('rh_espace_' + esp.user_id, esp);
    choisirEntreprise(false);
  }, function (e) {
    var c = CL.sess && CL.sess.user && lsGet('rh_espace_' + CL.sess.user.id);
    if (e.reseau && c) { CL.espace = c; CL.horsLigne = true; choisirEntreprise(false); }
    else if (e.reseau) ecranConnexion('Pas de connexion Internet. La première connexion sur cet ordinateur doit se faire en ligne.');
    else { oublierSession(); ecranConnexion(errFr(e)); }
  });
}
function choisirEntreprise(forcer) {
  var orgs = CL.espace.organisations || [], der = lsGet('rh_derniere_org');

    if (orgs.length === 1) return ouvrirOrg(orgs[0]);
    var d = orgs.filter(function (o) { return o.id === der; })[0]; if (d) return ouvrirOrg(d);
  }
  if (!orgs.length && estPoste()) return ecranActivation('Ce poste n\'est rattaché à aucune licence (poste désactivé ?). Saisissez la clé de licence.', 'warn');
  var em = (CL.espace.email || (CL.sess && CL.sess.user && CL.sess.user.email) || '');
  var liste = orgs.map(function (o) {
    var ok = licenceValide(o);
    return '<button type="button" class="org" data-id="' + esc(o.id) + '"><b>' + esc(o.nom) + '</b><span>' + esc(ROLES[o.role] || o.role) + ' · ' + (ok ? (o.essai ? 'Essai jusqu\'au ' : 'Licence jusqu\'au ') + fd(o.licence_fin) : '<em>Licence expirée</em>') + '</span></button>';
  }).join('');
  var vide = !orgs.length ? '<div class="note info"><pre>Votre compte (' + esc(em) + ') n\'est rattaché à aucune entreprise.\n\n• Si votre entreprise a une licence, demandez à son administrateur de vous ajouter avec cette adresse e-mail.\n• Pour acheter une licence annuelle, contactez ' + EDITEUR + '.</pre></div>' : '';
  var essai = CL.espace.essai_possible && !CL.horsLigne ? '<details class="essai"' + (orgs.length ? '' : ' open') + '><summary>Essayer gratuitement pendant 30 jours</summary><form class="grid" style="gap:10px;margin-top:10px">' + chp('aNom', 'Nom de votre entreprise', 'text') + '<div class="auth-msg"></div><button class="btn pri" type="submit" id="aEssai">Démarrer l\'essai</button></form></details>' : '';
  authShow('<h2>' + (orgs.length ? 'Choisir l\'entreprise' : 'Bienvenue') + '</h2>' + (CL.horsLigne ? '<div class="note warn" style="margin-bottom:10px"><pre>Hors connexion : travail sur les données gardées sur cet ordinateur.</pre></div>' : '') + vide + '<div class="orgs">' + liste + '</div>' + essai +
    '<div class="auth-links">' + (estEditeur() ? '<a href="#" id="aConsole">Console éditeur (licences)</a>' : '') + '<a href="#" id="aOut">Se déconnecter (' + esc(em) + ')</a></div>', function (a) {
    $$('.org', a).forEach(function (b) { b.onclick = function () { ouvrirOrg(orgs.filter(function (o) { return o.id === b.dataset.id; })[0]); }; });
    $('#aOut', a).onclick = function (ev) { ev.preventDefault(); deconnexion(); };
    if ($('#aConsole', a)) $('#aConsole', a).onclick = function (ev) { ev.preventDefault(); ouvrirSansOrg(); location.hash = '#editeur'; route(); };
    if ($('#aEssai', a)) $('#aEssai', a).onclick = function () {
      var nom = $('#aNom', a).value.trim(); if (!nom) { authMsg(a, 'Saisissez le nom de votre entreprise.'); return; }
      authOcc(a, true);
      rpc('creer_essai', { p_nom: nom }).then(function (id) { lsSet('rh_derniere_org', id); chargerEspace(); }, function (e) { authOcc(a, false); authMsg(a, errFr(e)); });
    };

// ---------- Données de l'entreprise ----------
function etatVierge(nom) {
  var P = JSON.parse(JSON.stringify(RH.PARAM_DEFAUT));
  ['adresse', 'tel', 'email', 'mention', 'fonctionSign', 'nomSign'].forEach(function (k) { P[k] = ''; });
  P.nom = nom || ''; P.logo = '';
  var d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1, fin = new Date(y, m, 0).getDate();
  return { v: 1, P: P, emps: [], periode: { debut: y + '-' + String(m).padStart(2, '0') + '-01', fin: y + '-' + String(m).padStart(2, '0') + '-' + fin }, ui: uiDefaut(), ret: {} };
}
function uiDefaut() { return { bulMat: '', modePaie: 'Virement', hsMat: '', hsGrille: [[], [], [], [], []], attMat: '', certMat: '', vue: 'resume' }; }
function contenu() { var c = {}; Object.keys(S).forEach(function (k) { if (k !== 'ui') c[k] = S[k]; }); return c; }
function cleContenu() { var c = contenu(); delete c.maj; return JSON.stringify(c); }
function ecrireCache() { if (CL.org) lsSet('rh_org_' + CL.org.id, { version: CL.version, dirty: CL.dirty, data: contenu() }); }

// ---------- Copie de secours automatique (dossier Google Drive) ----------
// En plus de l'enregistrement en ligne, le logiciel réécrit un fichier .json
// choisi par l'utilisateur (dans le dossier « Google Drive » de l'ordinateur)
// à chaque modification : les données restent disponibles même si le
// serveur en ligne s'arrête. Le fichier se recharge par Fichier › Importer.
var DR = { h: null, etat: 'aucun', dernier: null, cle: '', t: null };
var fsOK = typeof window.showSaveFilePicker === 'function';
function idb() { return new Promise(function (res, rej) { var r = indexedDB.open('gestion_rh_paie', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
function idbSet(k, v) { return idb().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction('kv', 'readwrite'); if (v === null) tx.objectStore('kv').delete(k); else tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = function () { rej(tx.error); }; }); }); }
function idbGet(k) { return idb().then(function (db) { return new Promise(function (res, rej) { var rq = db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { rej(rq.error); }; }); }); }
function cleDrive() { return CL.org ? 'drive_' + CL.org.id : null; }
function copieDrive(forcer) {
  if (!DR.h || DR.etat !== 'ok' || !S || !CL.org) return;
  var cle = cleContenu();
  if (!forcer && cle === DR.cle) return;
  clearTimeout(DR.t);
  DR.t = setTimeout(function () {
    var c = contenu(); c.copieDe = { entreprise: CL.org.nom, le: new Date().toISOString(), logiciel: 'Gestion RH & Paie' };
    DR.h.createWritable().then(function (w) { return w.write(JSON.stringify(c, null, 1)).then(function () { return w.close(); }); })
      .then(function () { DR.cle = cle; DR.dernier = new Date(); majEtatDrive(); })
      .catch(function () { DR.etat = 'perm'; majEtatDrive(); });
  }, 1500);
}
function majEtatDrive() {
  var el = $('#driveState'); if (!el) return;
  if (!CL.org || !fsOK) { el.innerHTML = ''; return; }
  if (DR.etat === 'ok') el.innerHTML = '<span class="dot"></span>Copie Drive : ' + esc(DR.h.name) + (DR.dernier ? ' · ' + hm(DR.dernier) : '');
  else if (DR.etat === 'perm') el.innerHTML = '<span class="dot ko"></span><a href="#" id="driveRe">Copie Drive en pause : cliquez pour reprendre</a>';
  else el.innerHTML = '<span class="dot ko"></span><a href="#" id="driveCfg">Copie Google Drive non activée</a>';
  var a = $('#driveRe'); if (a) a.onclick = function (ev) { ev.preventDefault(); reprendreDrive(); };
  var c = $('#driveCfg'); if (c) c.onclick = function (ev) { ev.preventDefault(); configDrive(); };
}
function lierDrive(h) {
  DR.h = h; DR.etat = 'ok'; DR.cle = '';
  if (cleDrive()) idbSet(cleDrive(), h).catch(function () {});
  majEtatDrive(); copieDrive(true);
}
function reprendreDrive() {
  if (!DR.h) return configDrive();
  DR.h.requestPermission({ mode: 'readwrite' }).then(function (p) { if (p === 'granted') { DR.etat = 'ok'; majEtatDrive(); copieDrive(true); } }).catch(function () {});
}
function demarrerDrive() {
  DR.h = null; DR.etat = 'aucun'; DR.cle = ''; majEtatDrive();
  if (!fsOK || !window.indexedDB || !cleDrive()) return;
  var org = CL.org;
  idbGet(cleDrive()).then(function (h) {
    if (!h || CL.org !== org) return;
    DR.h = h;
    return h.queryPermission({ mode: 'readwrite' }).then(function (p) { DR.etat = p === 'granted' ? 'ok' : 'perm'; majEtatDrive(); copieDrive(true); });
  }).catch(function () {});
}
function configDrive() {
  if (!CL.org) return;
  if (!fsOK) { alerte('Copie Google Drive', 'Cette fonction nécessite Microsoft Edge ou Google Chrome (ou le logiciel installé).\n\nEn attendant, utilisez Fichier › Exporter une copie (.json) et enregistrez le fichier dans Google Drive.', 'warn'); return; }
  dialog({ titre: 'Copie de secours dans Google Drive',
    html: '<div class="note info"><pre>En plus de l\'enregistrement en ligne, le logiciel peut écrire une copie de vos données dans un fichier, à chaque modification.\nPlacé dans le dossier Google Drive de l\'ordinateur, ce fichier est envoyé automatiquement dans votre compte Google : vos données restent disponibles même si le serveur en ligne s\'arrête.\n\n1. Installez « Google Drive pour ordinateur » (drive.google.com/download) et connectez-vous. Un lecteur « Google Drive » apparaît dans l\'Explorateur de fichiers.\n2. Cliquez sur « Choisir le fichier de copie » et enregistrez-le dans Google Drive › Mon Drive (par exemple dans un dossier « Gestion RH »).\n3. C\'est tout : la copie est mise à jour à chaque modification.\n\nPour recharger la copie : Fichier › Importer une sauvegarde (.json).</pre></div>' +
      (DR.h ? '<p style="margin:0">Fichier actuel : <b>' + esc(DR.h.name) + '</b>' + (DR.dernier ? ' — dernière copie à ' + hm(DR.dernier) : '') + '</p>' : ''),
    boutons: [{ t: 'Fermer' }].concat(DR.h ? [{ t: 'Arrêter la copie', cls: 'dan', fn: function () { DR.h = null; DR.etat = 'aucun'; if (cleDrive()) idbSet(cleDrive(), null).catch(function () {}); majEtatDrive(); } }] : [])
      .concat([{ t: 'Choisir le fichier de copie', cls: 'pri', fn: function () {
        window.showSaveFilePicker({ suggestedName: 'Gestion RH - ' + (CL.org.nom || 'donnees') + '.json', types: [{ description: 'Données Gestion RH', accept: { 'application/json': ['.json'] } }] })
          .then(function (h) { lierDrive(h); toast('Copie Google Drive activée : ' + h.name); }).catch(function () {});
      } }]) });
}


function appliquer(data, version, dirty) {
  var ui = (CL.org && lsGet('rh_ui_' + CL.org.id)) || (S && S.ui) || uiDefaut();
  S = data; S.ui = ui; S.ret = S.ret || {}; S.P = S.P || etatVierge('').P; S.emps = S.emps || [];
  if (!S.periode) S.periode = etatVierge('').periode;
  ['bulMat', 'hsMat', 'attMat', 'certMat'].forEach(function (k) { if (S.ui[k] && !S.emps.some(function (e) { return String(e.mat) === String(S.ui[k]); })) S.ui[k] = ''; });
  CL.version = version; CL.dirty = false; CL.dernierEnvoye = dirty ? '' : cleContenu(); CL.dirty = !!dirty && !lectureSeule();
  if (!CL.dirty) CL.derniere = CL.derniere || new Date();
  initListes(); appliquerTheme(); ecrireCache();
  authHide(); construireChrome(); route(); majEtatCloud(); demarrerSuivi();
  if (DR.org !== CL.org) { DR.org = CL.org; demarrerDrive(); } else copieDrive();
  if (CL.dirty) planifierEnvoi(0);
}
function ouvrirOrg(o) {
  if (!o) return choisirEntreprise(true);
  if (!licenceValide(o)) return ecranLicence(o);
  if (CL.org && CL.org.id !== o.id) { CL.derniere = null; }
  CL.org = o; lsSet('rh_derniere_org', o.id);
  var cache = lsGet('rh_org_' + o.id);
  ecranChargement('Ouverture de « ' + o.nom + ' »…');
  if (CL.horsLigne) {
    if (cache) return appliquer(cache.data, cache.version, cache.dirty);
    return ecranErreur('Pas de connexion Internet et aucune copie de « ' + o.nom + ' » sur cet ordinateur.', o);
  }
  rpc('charger', { o: o.id }).then(function (srv) {
    if (cache && cache.dirty && !lectureSeule()) {
      if (cache.version === srv.version) return appliquer(cache.data, cache.version, true);
      return conflit({ version: srv.version, contenu: srv.contenu, maj_le: srv.maj_le }, cache.data);
    }
    if (srv.contenu) return appliquer(srv.contenu, srv.version, false);
    var anc = lsGet(KEY);
    if (anc && Array.isArray(anc.emps) && anc.emps.length && !lectureSeule()) return proposerImport(anc);
    appliquer(etatVierge(o.nom), 0, !lectureSeule());
  }, function (e) {
    if (e.reseau && cache) { CL.horsLigne = true; appliquer(cache.data, cache.version, cache.dirty); }
    else if (e.reseau) ecranErreur('Pas de connexion Internet.', o);
    else if (e.message === 'LICENCE_EXPIREE') { o.licence_ok = false; ecranLicence(o); }
    else if (e.message === 'SESSION_EXPIREE') ecranConnexion(errFr(e));
    else ecranErreur(errFr(e), o);
  });
}
function ouvrirSansOrg() {
  CL.org = null; clearTimeout(CL.tEnvoi);
  S = etatVierge(EDITEUR); S.ui = uiDefaut();
  initListes(); appliquerTheme(); authHide(); construireChrome(); majEtatCloud();
}
function proposerImport(anc) {
  var o = CL.org;
  authShow('<h2>Reprendre vos données ?</h2><div class="note info"><pre>Des données de l\'ancienne version (enregistrées dans ce navigateur) ont été trouvées :\n« ' + esc(anc.P && anc.P.nom) + ' » — ' + anc.emps.length + ' salarié(s).\n\nVoulez-vous les importer dans « ' + esc(o.nom) + ' » ?</pre></div>' +
    '<div class="inline" style="justify-content:flex-end;margin-top:14px"><button class="btn" type="button" id="aNon">Commencer avec une base vide</button><button class="btn pri" type="button" id="aOui">Importer ces données</button></div>', function (a) {
    $('#aOui', a).onclick = function () { var d = JSON.parse(JSON.stringify(anc)); delete d.ui; appliquer(d, 0, true); toast('Données importées — envoi en ligne…'); };
    $('#aNon', a).onclick = function () { appliquer(etatVierge(o.nom), 0, true); };
  });
}
function conflit(r, mienne) {
  var quand = r.maj_le ? new Date(r.maj_le) : null;
  var q = quand ? ' le ' + fd(quand.toISOString().slice(0, 10)) + ' à ' + String(quand.getHours()).padStart(2, '0') + ':' + String(quand.getMinutes()).padStart(2, '0') : '';
  var nAutre = r.contenu && r.contenu.emps ? r.contenu.emps.length : 0, nMoi = mienne && mienne.emps ? mienne.emps.length : 0;
  authHide();
  dialog({ titre: 'Modifications simultanées', bloquant: true,

    var v = dialog({ titre: (nouvelle ? 'Nouvelle clé — ' : 'Licence créée — ') + nom, html: '<p style="margin:0">Clé de licence à remettre au client :</p><div class="cle-big">' + esc(k) + '</div><p class="auth-p">Le client installe le logiciel (Setup-GestionRH-Paie.exe) puis saisit cette clé sur chaque poste.</p>',
      boutons: [{ t: 'Copier la clé', fn: function () { (navigator.clipboard ? navigator.clipboard.writeText(k) : Promise.reject()).then(function () { toast('Clé copiée'); }, function () { window.prompt('Clé de licence', k); }); return false; } }, { t: 'Fermer', cls: 'pri' }] });
    return v;
  }
  $('#eNew', m).onclick = function () { formLicence(null); };
  $('#eRef', m).onclick = charger;
  charger();
}

function demarrerCloud() {
  var h = location.hash || '';
  if (/access_token=/.test(h)) {
    var p = {}; h.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
    history.replaceState(null, '', location.pathname + location.search);
    majSession({ access_token: p.access_token, refresh_token: p.refresh_token, expires_in: p.expires_in, expires_at: Number(p.expires_at) || 0 });
    ecranChargement('Connexion…');
    http('GET', '/auth/v1/user', undefined, p.access_token).then(function (u) {
      CL.sess.user = { id: u.id, email: u.email }; lsSet('rh_session', CL.sess);
      if (p.type === 'recovery') ecranNouveauMdp(); else chargerEspace();
    }, function (e) { oublierSession(); ecranConnexion(errFr(e)); });
    return;
  }
  if (/error_description=/.test(h)) {
    var m = /error_description=([^&]*)/.exec(h);
    history.replaceState(null, '', location.pathname + location.search);
    var d = decodeURIComponent((m && m[1] || '').replace(/\+/g, ' '));
    ecranConnexion(/expired|invalid/i.test(d) ? 'Le lien reçu par e-mail a expiré ou a déjà été utilisé. Recommencez (connexion ou « Mot de passe oublié »).' : d);
    return;
  }
  CL.sess = lsGet('rh_session');
  if (CL.sess && CL.sess.refresh_token) chargerEspace(); else ecranActivation();
}

function action(a) {
  if (a === 'sync') synchroniser(true);
  else if (a === 'drive') configDrive();
  else if (a === 'utilisateurs') gererUtilisateurs();
  else if (a === 'historique') voirHistorique();

  else if (a === 'mdp') changerMonMdp();
  else if (a === 'deconnexion') deconnexion();

  else if (a === 'restaurer') $('#fileRestore').click();
  else if (a === 'csv') exporterCSV();
  else if (a === 'periode') { if (location.hash !== '#bulletin') location.hash = '#bulletin'; setTimeout(bulletinsPeriode, 80); }
  else if (a === 'imprimer') { var b = $('#bPrint') || $('#dPrint'); if (b && !b.disabled) b.click(); else alerte('Imprimer', 'Ouvrez un bulletin de paie, une attestation ou un certificat de travail pour l\'imprimer.', 'info'); }
  else if (a === 'apropos') alerte('À propos', 'Gestion RH & Paie — version 2.1\nÉdité par ' + EDITEUR + ' — Bamako\nCalculs issus du classeur « Logiciel de gestion RH » (formules d\'origine conservées).' + (CL.org ? '\n\nEntreprise : ' + CL.org.nom + '\n' + (CL.org.essai ? 'Essai' : 'Licence') + ' valable jusqu\'au ' + fd(CL.org.licence_fin) + '\nUtilisateurs autorisés : ' + CL.org.max_utilisateurs : ''), 'info');
}
function construireChrome() {
  $('#menubar').innerHTML = menus().map(function (m, i) {
    return '<div class="mi"><button type="button" data-mi="' + i + '">' + m[0] + '</button><div class="dd">' + m[1].map(function (it) {
      if (it[0] === 'hr') return '<hr>';
      if (it[0] === 'lnk') return '<a href="#' + it[3] + '">' + ic(it[1]) + it[2] + '</a>';
      return '<button type="button" data-act="' + it[3] + '">' + ic(it[1]) + it[2] + '</button>';
    }).join('') + '</div></div>';
  }).join('');
  $('#toolbar').innerHTML = outils().map(function (t) {
    if (t[0] === 'sep') return '<span class="tsep"></span>';
    if (t[0] === 'lnk') return '<a class="tbtn" href="#' + t[3] + '" title="' + t[2] + '">' + ic(t[1]) + t[2] + '</a>';
    return '<button class="tbtn" type="button" data-act="' + t[3] + '" title="' + t[2] + '">' + ic(t[1]) + t[2] + '</button>';
  }).join('');
  var ouvert = false;
  $$('.mi>button').forEach(function (b) {
    b.onclick = function (ev) { ev.stopPropagation(); var mi = b.parentNode, etait = mi.classList.contains('open'); $$('.mi').forEach(function (x) { x.classList.remove('open'); }); if (!etait) mi.classList.add('open'); ouvert = !etait; };
    b.onmouseenter = function () { if (ouvert) { $$('.mi').forEach(function (x) { x.classList.remove('open'); }); b.parentNode.classList.add('open'); } };
  });
  if (!construireChrome.fait) { construireChrome.fait = true; document.addEventListener('click', function () { $$('.mi').forEach(function (x) { x.classList.remove('open'); }); ouvert = false; }); }
  $$('#menubar [data-act], #toolbar [data-act]').forEach(function (b) { b.onclick = function (ev) { ev.stopPropagation(); $$('.mi').forEach(function (x) { x.classList.remove('open'); }); ouvert = false; action(b.dataset.act); }; });
  $$('.dd a').forEach(function (a) { a.addEventListener('click', function () { $$('.mi').forEach(function (x) { x.classList.remove('open'); }); ouvert = false; }); });
}
function majChrome(id) {
  var p = PAGES.filter(function (x) { return x.id === id; })[0];

  var ref = $('#driveState') || $('#autoState') || st; parts.forEach(function (h) { var sp = document.createElement('span'); sp.innerHTML = h; sb.insertBefore(sp, ref); });
}
construireChrome();
$('#fileRestore').onchange = function () {
  var f = this.files[0]; if (!f) return; var inp = this;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var o = JSON.parse(rd.result);
      if (!o || !Array.isArray(o.emps) || !o.P) throw new Error('format');
      delete o.copieDe;
      confirmer('Restaurer une sauvegarde', '<p style="margin:0">Remplacer les données actuelles par la sauvegarde « ' + esc(f.name) + ' » (' + o.emps.length + ' salariés) ?</p>', 'Restaurer', function () {
        S = o; S.ui = S.ui || etatInitial().ui; S.ret = S.ret || {}; S.periode = S.periode || etatInitial().periode; save(); route(); toast('Sauvegarde restaurée');
      });
    } catch (err) { alerte('Restaurer', 'Ce fichier n\'est pas une sauvegarde de l\'application (fichier .json créé par le bouton « Sauvegarder les données »).', 'err'); }
    inp.value = '';
  };
  rd.readAsText(f);
};
